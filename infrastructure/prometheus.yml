global:
  scrape_interval: 15s
scrape_configs:
  - job_name: aegistrade-gateway
    static_configs:
      - targets: ["gateway:8000"]
    metrics_path: /metrics
  - job_name: aegistrade-collector
    static_configs:
      - targets: ["collector:8001"]
    metrics_path: /metrics

rule_files:
  - /etc/prometheus/alerts.yml
