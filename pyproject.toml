[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegistrade-module6"
version = "0.6.0"
description = "Binance paper/sandbox platform with separately gated live spot and futures canary execution"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "websockets>=14,<17",
  "psycopg[binary,pool]>=3.2,<4",
  "redis>=5,<8",
  "nats-py>=2.9,<3",
  "pydantic>=2.9,<3",
  "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
research = ["scikit-learn>=1.5,<2", "numpy>=1.26,<3"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
