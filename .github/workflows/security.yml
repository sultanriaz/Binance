name: Dependency security and secret boundary audit

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependencies:
    name: Audit Dependencies & Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12 with Pip Cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install dependencies and scanner
        run: python -m pip install -e '.[dev,research]' pip-audit

      - name: Audit installed Python dependencies
        run: python -m pip_audit --progress-spinner off

      - name: Secret boundaries and fault matrix
        run: |
          python -m pytest -q tests/test_operations_module5.py
          PYTHONPATH=src python scripts/ops/fault_drill.py
